[package]
name = "rescind"
description = "rescind: a language for provably reversible operations -- the operator CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rescind"
path = "src/main.rs"

[dependencies]
rescind-core = { path = "../core" }
rescind-render = { path = "../render" }
rescind-surface = { path = "../surface" }
rescind-engine = { path = "../engine" }
clap.workspace = true
serde_json.workspace = true
# The binary's error type; the library crates have their own.
anyhow.workspace = true
miette.workspace = true

[dev-dependencies]
rescind-tenants = { path = "../tenants/harness" }
serde_json.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# The test's own group id, for the socket's group.
libc = "0.2"
