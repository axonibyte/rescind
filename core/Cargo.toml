[package]
name = "rescind-core"
description = "rescind's core: the model, the checker, the verdict, the state machine (pure, no I/O)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rescind_core"
path = "src/lib.rs"

# Pure by construction: serde for the data shapes, serde_json for the
# canonical form. Nothing that reads a file, opens a socket or tells the time.
[dependencies]
serde.workspace = true
serde_json.workspace = true
# The journal chain and the request digest. A pure hash crate, no I/O.
sha2.workspace = true
