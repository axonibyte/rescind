[package]
name = "rescind-tenants"
description = "The acceptance tenants' harness: the case table, the golden contract, and the tests that hold rescind-core to the Phase 0 goldens"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The only golden writer; a development tool, not a shipped binary
# (ci/build-target.sh packages rescind, rescindd and rescind-hook and nothing else).
[[bin]]
name = "rescind-goldens"
path = "src/bin/rescind-goldens.rs"

# Lives under tenants/ because it names tenants; the seam guard exempts that
# directory and nothing else may.
[dependencies]
rescind-core = { path = "../../core" }
# The hook protocol's own tables, rendered to the frozen v1 document.
rescind-hook-proto = { path = "../../hook-proto" }
rescind-render = { path = "../../render" }
rescind-surface = { path = "../../surface" }
serde.workspace = true
serde_json.workspace = true
